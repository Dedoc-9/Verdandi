<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verðandi Studio</title>
<style>
  :root { --bg: #070a0e; --panel: #0e1319; --line: #26303a; --text: #dfe6ec; --dim: #8d99a5; --good: #9fe0a8; --bad: #ff9a8a; --accent: #ffd35a; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 ui-monospace, Consolas, monospace; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 40px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: 0.04em; color: #fff; }
  h2 { font-size: 12px; margin: 22px 0 8px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); font-weight: normal; }
  p.lead { margin: 4px 0 0; color: var(--dim); }
  .cols { display: grid; grid-template-columns: minmax(240px, 1fr) 2fr; gap: 20px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .world { display: block; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 0 0 8px; background: var(--panel); cursor: pointer; }
  .world.on { border-color: var(--accent); }
  .world input { margin: 0 6px 0 0; }
  .world .t { color: #fff; }
  .world .s { color: var(--dim); font-size: 12px; }
  .ok { color: var(--good); } .no { color: var(--bad); }
  .views { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .view { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
  .view .t { color: #fff; font-size: 14px; }
  .view .s { color: var(--dim); flex: 1; }
  .view .badge { font-size: 11px; color: var(--dim); }
  .view.off { opacity: 0.6; }
  .view .why { color: #ffd38a; font-size: 12px; }
  button { font: inherit; background: #1d2630; color: #e7eef4; border: 1px solid #3a4652; border-radius: 4px; padding: 5px 10px; cursor: pointer; align-self: flex-start; }
  button:hover { background: #283441; }
  button:disabled { opacity: 0.4; cursor: default; }
  .foot { margin-top: 22px; color: var(--dim); font-size: 12px; }
  #auto { display: none; border: 1px solid var(--accent); border-radius: 6px; padding: 8px 10px; margin: 14px 0 0; }
  label.rem { color: var(--dim); font-size: 12px; }
  .err { color: var(--bad); white-space: pre-wrap; }
</style>
</head>
<body data-presence="%PRESENCE%">
<main>
  <h1>Verðandi Studio</h1>
  <p class="lead">What would you like to open first?</p>
  <div id="auto"></div>
  <div class="cols">
    <section>
      <h2>World</h2>
      <div id="worlds"><div class="s">Reading the worlds and replaying each ledger…</div></div>
    </section>
    <section>
      <h2>Make</h2>
      <div class="views" id="paint"></div>
      <h2>One level deeper</h2>
      <div class="views" id="deep"></div>
      <p><label class="rem"><input type="checkbox" id="remember"> next time, skip this window and open the same view</label></p>
    </section>
  </div>
  <p class="foot" id="foot"></p>
</main>
<script src="/start.js"></script>
</body>
</html>
