<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verðandi — the native plaza</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #hud { position: fixed; left: 10px; top: 8px; color: #d6dde4; white-space: pre; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: #fff; border-radius: 50%; opacity: 0.7; pointer-events: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; text-align: center;
             background: rgba(10, 12, 16, 0.45); white-space: pre-line; cursor: pointer; }
  body.still #hud, body.still #cross, body.still #overlay, body.still #studio, body.still .mark { display: none; }
  /* the studio (STUDIO-0): the director's panel, beside the world, which goes on running */
  #studio { position: fixed; right: 12px; top: 12px; width: 380px; max-height: calc(100vh - 24px); overflow: auto; display: none;
            background: rgba(12, 15, 20, 0.92); color: #dfe6ec; border: 1px solid #2c3640; border-radius: 6px; padding: 10px 12px; }
  #studio.open { display: block; }
  #studio h2 { font-size: 13px; margin: 0 0 6px; letter-spacing: 0.04em; color: #fff; }
  #studio .dim { color: #8d99a5; }
  #studio .bad { color: #ff9a8a; }
  #studio .good { color: #9fe0a8; }
  #studio textarea { width: 100%; box-sizing: border-box; height: 74px; margin: 6px 0; resize: vertical; background: #0a0d11; color: #eef3f7;
                     border: 1px solid #34404b; border-radius: 4px; padding: 6px; font: inherit; }
  #studio button { font: inherit; background: #1d2630; color: #e7eef4; border: 1px solid #3a4652; border-radius: 4px; padding: 3px 8px; margin: 2px 4px 2px 0; cursor: pointer; }
  #studio button:hover { background: #283441; }
  #studio button:disabled { opacity: 0.4; cursor: default; }
  #studio .cand { border-top: 1px solid #26303a; padding: 6px 0; }
  #studio .cand.shown { background: rgba(80, 120, 160, 0.12); }
  /* the references (STUDIO-1): each tagged object framed and labelled; the target amber, a pin cyan */
  .mark { position: fixed; border: 1px solid #ffd35a; box-shadow: 0 0 0 1px rgba(0,0,0,0.6); pointer-events: none; display: none; }
  .mark.pin { border-color: #6fd8ff; border-style: dashed; }
  .mark span { position: absolute; left: -1px; top: -17px; padding: 0 4px; background: #ffd35a; color: #111; font-size: 11px; line-height: 16px; white-space: nowrap; }
  .mark.pin span { background: #6fd8ff; }
  #studio .ref { padding: 2px 0; }
  #studio .ref.changed { color: #ffd38a; }
  #studio .ref.gone { color: #ff9a8a; }
  #studio .ref button { margin-left: 6px; padding: 0 6px; }
  #studio .tags { padding: 2px 0 4px; }
  #studio .tag { margin: 0 4px 2px 0; padding: 0 6px; }
  #studio .tag.active { border-color: #ffd35a; }
  #studio .tag.gone { color: #ff9a8a; text-decoration: line-through; }
  /* STUDIO-2: the worlds and the queue */
  #studio select, #studio input { font: inherit; background: #0a0d11; color: #eef3f7; border: 1px solid #34404b; border-radius: 4px; padding: 2px 4px; }
  #studio .row { margin: 4px 0; }
  #studio h3 { font-size: 12px; margin: 10px 0 4px; color: #cfd8e0; border-top: 1px solid #26303a; padding-top: 6px; }
  #studio .task { padding: 3px 0; border-top: 1px dotted #26303a; }
  #studio .task .st { display: inline-block; min-width: 72px; }
  #studio .task.ready .st { color: #9fe0a8; }
  #studio .task.failed .st, #studio .task.interrupted .st { color: #ff9a8a; }
  #studio .task.running .st { color: #ffd38a; }
  #toasts { position: fixed; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  #toasts div { background: rgba(12, 15, 20, 0.92); color: #dfe6ec; border: 1px solid #2c3640; border-left: 3px solid #9fe0a8; border-radius: 4px;
                padding: 5px 9px; max-width: 420px; }
  #toasts div.bad { border-left-color: #ff9a8a; }
  body.still #toasts { display: none; }
</style>
</head>
<body data-brief="%BRIEF%" data-sha="%SHA%" data-studio="%STUDIO%">
<canvas id="view"></canvas>
<div id="hud"></div>
<div id="cross"></div>
<div id="overlay">Click to play
(the mouse is captured; Esc releases it · 1–9 the registered views · E target · R pin · Enter summons the director · Backspace resets)</div>
<div id="studio">
  <h2>Director</h2>
  <div class="row">world <select id="st-world"></select> <input id="st-newname" size="14" placeholder="new world's name"><button id="st-dup">Duplicate</button></div>
  <div id="st-provider" class="dim"></div>
  <div id="st-refs"></div>
  <textarea id="st-prompt" placeholder="Describe the change; name tagged objects as @1, @2 (Ctrl+Enter asks; Esc goes back to the world)"></textarea>
  <div><button id="st-ask">Ask</button><button id="st-cancel" disabled>Cancel</button><button id="st-original">Original</button><button id="st-undo">Undo last admission</button></div>
  <div id="st-status" class="dim"></div>
  <div id="st-cands"></div>
  <h3>Queue</h3>
  <div class="row">for <select id="st-qworld"></select> <select id="st-qprov"></select> <select id="st-qmodel"></select></div>
  <div class="row"><button id="st-queue">Queue the prompt</button> <span class="dim">it runs in the background; play on</span></div>
  <div id="st-qlist"></div>
</div>
<div id="toasts"></div>
<script src="sim.js"></script>
<script src="scene_render.js"></script>
<script src="play.js"></script>
</body>
</html>
